name: Two-Job Dependent Workflow

# Triggers when code is pushed to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  # --- JOB 1: FIRST TASK ---
  job-1:
    name: "Job 1: Build & Prepare"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run First Task
        run: |
          echo "Running Job 1..."
          # Replace with your build script, e.g., npm run build

  # --- JOB 2: DEPENDENT TASK ---
  job-2:
    name: "Job 2: Test & Deploy"
    needs: job-1  # <--- THIS FORCES JOB 2 TO WAIT FOR JOB 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Second Task
        run: |
          echo "Job 1 completed successfully! Now running Job 2..."
          # Replace with your deployment or second-stage script
